[project]
name = "dronewatch"
version = "0.1.0"
description = "AI-Powered Multi-Drone Campus Video Analysis & Alerting System using Gemini 3.6 Flash and AlloyDB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "google-genai>=0.1.1",
    "google-cloud-storage>=2.18.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "opencv-python-headless>=4.10.0",
    "numpy>=1.26.0",
    "av>=18.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dronewatch"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
